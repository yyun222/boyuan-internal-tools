<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · Boyuan Internal Tools</title>
  <link rel="stylesheet" href="/static/style.css?v=20260713-stock-orders" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <img src="/static/logo.png" alt="Logo" class="login-logo" />
    </div>
    <form id="login-form" class="login-form">
      <label>
        <span>邮箱</span>
        <input type="email" id="username" autocomplete="username" required autofocus />
      </label>
      <label>
        <span>密码</span>
        <input type="password" id="password" autocomplete="current-password" required />
      </label>
      <button type="submit" id="login-btn">登录</button>
      <div id="login-error" class="login-error"></div>
      <a class="login-link" href="/signup">已有邀请？设置密码</a>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errEl = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      btn.disabled = true;
      try {
        const resp = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          const err = data;
          throw new Error(err.detail || "登录失败");
        }
        sessionStorage.setItem("boyuan_current_user", JSON.stringify(data.user));
        window.location.href = "/";
      } catch (err) {
        errEl.textContent = err.message || String(err);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
